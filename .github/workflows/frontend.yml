name: Frontend CI/CD

on:
  push:
    paths:
      - "frontend/**"
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm run test:unit

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Build Expo
        run: expo export