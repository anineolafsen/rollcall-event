name: Frontend CI/CD

on:
  push:
    paths:
      - "frontend/**"
    branches:
      - 1-initial-setup-of-development-environment

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Build Expo
        run: expo export